name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          arch: win64_msvc2022_64
          cache: true

      - name: Test Panorama logic
        shell: pwsh
        run: node .\tests\test_demo_voice_mask.js

      - name: Build and test Qt launcher
        shell: pwsh
        run: .\launcher\build-launcher.ps1 -QtRoot $env:QT_ROOT_DIR -SkipVpkCheck
